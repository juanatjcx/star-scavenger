<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Star Scavenger</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05060a;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  canvas { image-rendering: pixelated; display: block; }
  #error {
    display: none; position: fixed; inset: 0; padding: 24px;
    background: #2a0b12; color: #ffb3c0; font-size: 14px;
    line-height: 1.6; white-space: pre-wrap; overflow: auto; z-index: 10;
  }
  #error b { color: #fff; }
</style>
</head>
<body>

<!-- The error net is installed BEFORE any other script. A script that fails to
     parse never runs a single one of its own lines, so a handler living inside
     game.js is exactly the handler that is missing when game.js is what broke. -->
<script>
  window.__errorCount = 0;
  window.__showError = function (message, source) {
    var box = document.getElementById('error');
    if (!box) return;
    window.__errorCount++;
    // The FIRST error wins. A parse error in config.js does not stop sprites.js
    // and game.js from loading, so Game.start() goes on to fail with a second,
    // misleading error ("CONFIG is not defined", which blames game.js for a
    // broken config.js). The first message is the root cause; later ones are
    // only counted, and the console still has them all.
    if (window.__errorCount > 1) {
      var more = document.getElementById('more');
      if (more) {
        var laterCount = window.__errorCount - 1;
        more.textContent = '\n\n(' + laterCount + ' later error' +
          (laterCount === 1 ? '' : 's') + ' followed this one — see the console)';
      }
      return;
    }
    var hint = '';
    if (location.protocol === 'file:') {
      hint = '\n\nYou opened this file directly, so the browser hides the real ' +
             'message.\nDouble-click serve.command and try again, or press ' +
             'Cmd-Option-J to see it in the console.';
    }
    box.innerHTML = '<b>The game stopped. Here is why:</b>\n\n' +
      String(message).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) +
      (source ? '\n\nin ' + source : '') + hint + '<span id="more"></span>';
    box.style.display = 'block';
  };
  window.addEventListener('error', function (e) {
    window.__showError(e.message || 'Unknown error', (e.filename || '').split('/').pop());
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__showError('Unhandled promise rejection: ' + (e.reason && e.reason.message || e.reason), '');
  });
</script>

<div id="error"></div>
<canvas id="game"></canvas>

<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
<script>
  // try/catch is the primary reporter: it keeps the real message and stack even
  // when the page is on file://, where the window listener only gets
  // "Script error." with no filename.
  try {
    Game.start(document.getElementById('game'));
  } catch (e) {
    // Pull the filename out of the stack rather than guessing — the error may
    // have come from any of the three files.
    var stack = (e && e.stack) || '';
    var match = stack.match(/\/([A-Za-z0-9_.-]+\.js):/);
    window.__showError(stack || String(e), match ? match[1] : '');
  }
</script>
<script>
  // Auto-reload while working locally: poll serve.py for the most recent
  // edit and reload the instant it changes, so the loop is save -> the room
  // sees it, with nobody touching the browser.
  //
  // Gated to localhost/127.0.0.1 on purpose, not just because the endpoint
  // only exists there. A security review of this project established that
  // the published game makes NO network requests at all — that's a property
  // worth keeping true, and this check is what keeps it true.
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    var __lastChanged = null;
    setInterval(function () {
      fetch('/__changed', { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          if (__lastChanged === null) { __lastChanged = text; return; }
          if (text !== __lastChanged) { location.reload(); }
        })
        .catch(function () {
          // The server isn't there (Terminal closed, or not started yet).
          // Swallow it. An unhandled rejection here would reach the
          // window listener above and paint a red error panel over a game
          // that is otherwise perfectly fine — AudioContext.resume() caused
          // this exact bug once already; this is the same mistake waiting
          // to happen again if this catch is ever removed.
        });
    }, 1000);
  }
</script>
</body>
</html>
